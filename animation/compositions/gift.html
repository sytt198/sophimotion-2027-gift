<template>
  <style>
    #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; background:#080b10; font-family:Inter,Arial,sans-serif; }
    #gift-canvas { display:block; position:absolute; top:200px; width:1920px; height:760px; }
    .gift-brand { position:absolute; top:62px; left:96px; font-size:28px; letter-spacing:.2em; color:#e4e8f4; }
    .gift-edition { position:absolute; right:96px; top:62px; font-size:28px; letter-spacing:.16em; color:#aab3ca; }
    .gift-copy { position:absolute; left:96px; top:134px; width:1728px; display:flex; align-items:baseline; gap:70px; }
    .gift-copy strong { display:block; width:400px; font-size:64px; line-height:1.05; letter-spacing:-.055em; font-weight:400; }
    .gift-copy p { margin:0; font-size:28px; line-height:1.5; letter-spacing:-.01em; color:#bac3d8; }
    .gift-rule { position:absolute; left:96px; bottom:72px; width:1728px; height:2px; background:#323d59; }
    #gift-progress { position:absolute; inset:0; width:1728px; height:2px; background:#5b7aff; transform-origin:left center; }
    .gift-footer { position:absolute; left:96px; bottom:92px; margin:0; font-size:28px; letter-spacing:.14em; color:#b5bed3; }
    .gift-count { position:absolute; right:96px; bottom:92px; margin:0; font-size:28px; letter-spacing:.12em; color:#b5bed3; }
  </style>
  <div id="root" data-composition-id="gift" data-width="1920" data-height="1080" data-duration="14">
    <canvas id="gift-canvas" aria-label="2027 gift box opening"></canvas>
    <div class="gift-brand">SOPHIMOTION</div>
    <div class="gift-edition">2027 GIFT COLLECTION</div>
    <div id="gift-copy-1" class="gift-copy"><strong>2027</strong><p>A gift, thoughtfully assembled.</p></div>
    <div id="gift-copy-2" class="gift-copy"><strong>OPEN</strong><p>Two wings. One signature.</p></div>
    <div id="gift-copy-3" class="gift-copy"><strong>EVERYDAY</strong><p>Four objects, one collection.</p></div>
    <div id="gift-copy-4" class="gift-copy"><strong>TOGETHER</strong><p>Ready for a new year.</p></div>
    <p class="gift-footer">BLACK / SILVER / KLEIN BLUE</p><p class="gift-count">FOUR OBJECTS · ONE BOX</p>
    <div class="gift-rule"><div id="gift-progress"></div></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { createGiftScene } from './assets/scene/gift-scene.js';
    const tl = gsap.timeline({paused:true});
    for (let i=1; i<=4; i++) tl.set(`#gift-copy-${i}`,{opacity:0,y:16},0);
    [[1,0,4.1],[2,4.2,8],[3,8.1,11.1],[4,11.2,14]].forEach(([i,start,end])=>{
      tl.fromTo(`#gift-copy-${i}`,{opacity:0,y:16},{opacity:1,y:0,duration:.5,ease:'power2.out'},start);
      if(end<14) tl.to(`#gift-copy-${i}`,{opacity:0,y:-10,duration:.25,ease:'power1.in'},end-.25);
    });
    tl.fromTo('#gift-progress',{scaleX:0},{scaleX:1,duration:14,ease:'none'},0);
    window.__timelines['gift'] = tl;
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    let giftScene;
    let requestedTime = 0;
    function renderAt(time) {
      requestedTime = Math.max(0,Math.min(14,time));
      if(!giftScene) return;
      giftScene.setProgress(requestedTime/14);
      giftScene.render();
    }
    window.addEventListener('hf-seek', event => renderAt(event.detail.time));
    window.__hf.buildReady.gift = createGiftScene({canvas:document.getElementById('gift-canvas'),quality:'high'}).then(scene => {
      giftScene=scene;
      scene.resize(1920,760);
      if(scene.setExplore)scene.setExplore(false);
      renderAt(requestedTime);
      window.__giftVideo = {renderAt,scene};
    });
  </script>
</template>
